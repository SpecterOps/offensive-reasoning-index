version: 1

# Phase 3 config for explicit Ollama context aliases.
#
# Before running phase3a_direct_m4 or phase3b_mcp_m4, create the alias models:
#
#   ./scripts/create_phase3_m4_ollama_models.sh
#
# This avoids relying on per-request num_ctx behavior through Ollama's
# OpenAI-compatible API.

defaults:
  bhce_url: https://bloodhound.mwnickerson.com
  concurrency: 1
  model_base_url: http://127.0.0.1:11434
  max_model_reruns_on_infra: 1
  health:
    timeout_seconds: 60
    poll_interval: 5
  mcp:
    mcp_dir: ../bloodhound-mcp
    max_steps: 20
    resource_mode: off
  telemetry:
    enabled: true

profiles:
  preflight_local:
    kind: preflight
    manifest: datasets/phase3b_manifest.json
    output_dir: results/preflight-phase3-m4

  phase3a_direct_m4:
    kind: baseline
    manifest: datasets/phase3b_manifest.json
    output_dir: results/phase3a-m4-direct-cypher
    models:
      - name: gemma4-26b-32k
        model: ollama/ori-gemma4-26b-32k

      - name: gemma4-26b-64k
        model: ollama/ori-gemma4-26b-64k

      - name: gemma4-e4b-32k
        model: ollama/ori-gemma4-e4b-32k

      - name: gemma4-e4b-64k
        model: ollama/ori-gemma4-e4b-64k

      - name: gpt-oss-20b-32k
        model: ollama/ori-gpt-oss-20b-32k

      - name: gpt-oss-20b-64k
        model: ollama/ori-gpt-oss-20b-64k

      - name: qwen3-14b-32k
        model: ollama/ori-qwen3-14b-32k

      - name: qwen3-14b-64k
        model: ollama/ori-qwen3-14b-64k

      - name: qwen3-coder-30b-32k
        model: ollama/ori-qwen3-coder-30b-32k

      - name: qwen3-coder-30b-64k
        model: ollama/ori-qwen3-coder-30b-64k

      - name: qwen3.5-27b-32k
        model: ollama/ori-qwen35-27b-32k

      - name: qwen3.5-27b-64k
        model: ollama/ori-qwen35-27b-64k

      - name: qwen3.5-9b-32k
        model: ollama/ori-qwen35-9b-32k

      - name: qwen3.5-9b-64k
        model: ollama/ori-qwen35-9b-64k

  phase3b_mcp_m4:
    kind: baseline-mcp
    manifest: datasets/phase3b_manifest.json
    output_dir: results/phase3b-m4-mcp
    models:
      - name: gemma4-26b-32k
        model: ollama/ori-gemma4-26b-32k

      - name: gemma4-26b-64k
        model: ollama/ori-gemma4-26b-64k

      - name: gemma4-e4b-32k
        model: ollama/ori-gemma4-e4b-32k

      - name: gemma4-e4b-64k
        model: ollama/ori-gemma4-e4b-64k

      - name: gpt-oss-20b-32k
        model: ollama/ori-gpt-oss-20b-32k

      - name: gpt-oss-20b-64k
        model: ollama/ori-gpt-oss-20b-64k

      - name: qwen3-14b-32k
        model: ollama/ori-qwen3-14b-32k

      - name: qwen3-14b-64k
        model: ollama/ori-qwen3-14b-64k

      - name: qwen3-coder-30b-32k
        model: ollama/ori-qwen3-coder-30b-32k

      - name: qwen3-coder-30b-64k
        model: ollama/ori-qwen3-coder-30b-64k

      - name: qwen3.5-27b-32k
        model: ollama/ori-qwen35-27b-32k

      - name: qwen3.5-27b-64k
        model: ollama/ori-qwen35-27b-64k

      - name: qwen3.5-9b-32k
        model: ollama/ori-qwen35-9b-32k

      - name: qwen3.5-9b-64k
        model: ollama/ori-qwen35-9b-64k

  phase3c_mcp_resources_m4:
    kind: baseline-mcp
    manifest: datasets/phase3b_manifest.json
    output_dir: results/phase3c-m4-mcp-resources
    mcp:
      resource_mode: on-demand
    models:
      - name: gemma4-26b-32k
        model: ollama/ori-gemma4-26b-32k

      - name: gemma4-26b-64k
        model: ollama/ori-gemma4-26b-64k

      - name: gemma4-e4b-32k
        model: ollama/ori-gemma4-e4b-32k

      - name: gemma4-e4b-64k
        model: ollama/ori-gemma4-e4b-64k

      - name: gpt-oss-20b-32k
        model: ollama/ori-gpt-oss-20b-32k

      - name: gpt-oss-20b-64k
        model: ollama/ori-gpt-oss-20b-64k

      - name: qwen3-14b-32k
        model: ollama/ori-qwen3-14b-32k

      - name: qwen3-14b-64k
        model: ollama/ori-qwen3-14b-64k

      - name: qwen3-coder-30b-32k
        model: ollama/ori-qwen3-coder-30b-32k

      - name: qwen3-coder-30b-64k
