# Generic OpenAI-compatible ORI inference template.
#
# Copy this file to a local run config and replace placeholders. Keep real
# endpoint hostnames, API keys, and private model aliases out of public commits.
#
# Secret handling:
# - Set OPENAI_COMPAT_API_KEY for most OpenAI-compatible gateways.
# - Some gateways accept OPENAI_API_KEY instead; check your provider docs.
# - Do not put API keys in this YAML file.

version: 1

defaults:
  bhce_url: ${ORI_BHCE_URL:-https://bloodhound.example.invalid}
  concurrency: 1
  max_model_reruns_on_infra: 1
  mcp:
    mcp_dir: ${ORI_BLOODHOUND_MCP_DIR:-../bloodhound-mcp}
    max_steps: 16
    resource_mode: off
    tool_loop: native-openai-compatible
    openai_compat_telemetry_adapter: generic
    ollama_read_timeout_seconds: 900

profiles:
  preflight_local:
    kind: preflight
    manifest: ${ORI_MANIFEST:-datasets/phase4-v1_manifest.json}
    output_dir: ${ORI_PREFLIGHT_OUTPUT_DIR:-results/preflight-openai-compatible}

  eval_mcp_openai_compatible:
    enabled: false
    kind: eval-mcp
    manifest: ${ORI_MANIFEST:-datasets/phase4-v1_manifest.json}
    output: ${ORI_OUTPUT:-results/openai-compatible/example-model-mcp.csv}
    model:
      name: example-openai-compatible-model
      model: openai-compat/provider-model-name
      model_base_url: ${ORI_OPENAI_BASE_URL:-https://api.example.invalid/v1}
      mcp_tool_loop: native-openai-compatible
      openai_compat_telemetry_adapter: generic
      options:
        temperature: 0
