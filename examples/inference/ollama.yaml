# Ollama ORI inference template.
#
# This uses ORI's native Ollama provider path. Ollama's default HTTP endpoint is
# http://127.0.0.1:11434, but native Ollama model names usually only need the
# `ollama/<model>` prefix below.

version: 1

defaults:
  bhce_url: ${ORI_BHCE_URL:-https://bloodhound.example.invalid}
  concurrency: 1
  max_model_reruns_on_infra: 1
  mcp:
    mcp_dir: ${ORI_BLOODHOUND_MCP_DIR:-../bloodhound-mcp}
    max_steps: 16
    resource_mode: off
    tool_loop: auto
    ollama_read_timeout_seconds: 900

profiles:
  preflight_local:
    kind: preflight
    manifest: ${ORI_MANIFEST:-datasets/phase4-v1_manifest.json}
    output_dir: ${ORI_PREFLIGHT_OUTPUT_DIR:-results/preflight-ollama}

  eval_mcp_ollama:
    enabled: false
    kind: eval-mcp
    manifest: ${ORI_MANIFEST:-datasets/phase4-v1_manifest.json}
    output: ${ORI_OUTPUT:-results/ollama/example-model-mcp.csv}
    model:
      name: example-ollama-model
      model: ollama/example-model:latest
      mcp_tool_loop: auto
      options:
        temperature: 0
        num_ctx: 65536
