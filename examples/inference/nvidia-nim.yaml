# NVIDIA NIM OpenAI-compatible ORI inference template.
#
# Set OPENAI_COMPAT_API_KEY to a NIM API key before running. Keep credentials out
# of committed YAML. Replace the model with the NIM model identifier you intend
# to evaluate.

version: 1

defaults:
  bhce_url: ${ORI_BHCE_URL:-https://bloodhound.example.invalid}
  concurrency: 1
  max_model_reruns_on_infra: 1
  mcp:
    mcp_dir: ${ORI_BLOODHOUND_MCP_DIR:-../bloodhound-mcp}
    max_steps: 16
    resource_mode: off
    tool_loop: native-openai-compatible
    openai_compat_telemetry_adapter: generic

profiles:
  eval_mcp_nvidia_nim:
    enabled: false
    kind: eval-mcp
    manifest: ${ORI_MANIFEST:-datasets/phase4-v1_manifest.json}
    output: ${ORI_OUTPUT:-results/nvidia-nim/example-model-mcp.csv}
    model:
      name: example-nvidia-nim-model
      model: openai-compat/nvidia/example-model
      model_base_url: https://integrate.api.nvidia.com/v1
      mcp_tool_loop: native-openai-compatible
      openai_compat_telemetry_adapter: generic
      options:
        temperature: 0
