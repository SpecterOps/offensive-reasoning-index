# BloodHound MCP environment template for ORI.
#
# This is not a runnable run-config by itself. It documents the environment
# variables and MCP defaults that ORI eval configs normally reference.
#
# Required BloodHound CE environment variables:
#
#   BLOODHOUND_DOMAIN=bhce.example.invalid
#   BLOODHOUND_SCHEME=https
#   BLOODHOUND_PORT=443
#   BLOODHOUND_TOKEN_ID=<set in shell or secret manager>
#   BLOODHOUND_TOKEN_KEY=<set in shell or secret manager>
#
# Do not commit real token IDs, token keys, production hostnames, or customer
# BloodHound endpoints.

version: 1

defaults:
  bhce_url: ${ORI_BHCE_URL:-https://bloodhound.example.invalid}
  mcp:
    mcp_dir: ${ORI_BLOODHOUND_MCP_DIR:-../bloodhound-mcp}
    max_steps: 16
    resource_mode: off
    tool_loop: auto
    openai_compat_telemetry_adapter: auto
    ollama_read_timeout_seconds: 900

profiles:
  preflight_local:
    kind: preflight
    manifest: ${ORI_MANIFEST:-datasets/phase4-v1_manifest.json}
    output_dir: ${ORI_PREFLIGHT_OUTPUT_DIR:-results/preflight-bloodhound-mcp}
