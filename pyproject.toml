[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bloodhound-eval"
version = "0.1.0"
description = "Benchmark for evaluating AI models on Active Directory attack path analysis"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "faker>=24.0",
    "pyyaml>=6.0",
]

[project.scripts]
bloodhound-eval = "bloodhound_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bloodhound_eval"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
