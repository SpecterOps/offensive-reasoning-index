[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "offensive-reasoning-index"
version = "0.1.0"
description = "Benchmark for evaluating AI models on Active Directory attack path analysis"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "faker>=24.0",
    "pyyaml>=6.0",
    "anthropic>=0.87.0",
    "openai>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "inspect-ai>=0.3.203",
    "mcp>=1.28.1",
    "pydantic>=2.12,<3",
    "psutil>=5.9",
    "jsonschema>=4.26,<5",
]

[project.scripts]
ori = "ori.cli:main"

[project.optional-dependencies]
native-mcp = ["neo4j==5.28.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ori"]

[dependency-groups]
dev = [
    "neo4j==5.28.2",
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
