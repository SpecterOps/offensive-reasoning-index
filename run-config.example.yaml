version: 1

defaults:
  bhce_url: null
  concurrency: 1
  model_base_url: null
  max_model_reruns_on_infra: 1
  health:
    timeout_seconds: 60
    poll_interval: 5
  mcp:
    launcher: uvx_git
    source: git+https://github.com/mwnickerson/bloodhound_mcp@cdb17097e761c8a8622cb93bc3ba49a9e150bb6e
    executable: bloodhound-mcp
    max_steps: 12
    resource_mode: "off"
    # auto keeps Ollama on ORI's native MCP tool loop and uses Inspect for other supported providers.
    # Use native-openai-compatible for mlx/llama.cpp-style OpenAI-compatible servers with tools.
    tool_loop: auto
    # For native-openai-compatible runs, parse provider-specific metrics when available:
    # generic, llama-cpp, mlx-lm, vllm, lm-studio, or auto.
    openai_compat_telemetry_adapter: auto
    ollama_read_timeout_seconds: 900
  telemetry:
    # Writes results/<run>/telemetry/{run_environment.json,models/,samples/,telemetry_summary.csv}
    # Disable only for fast smoke/debug loops: `ori run ... --no-telemetry`.
    enabled: true

profiles:
  phase3a_direct_m4:
    kind: baseline
    manifest: datasets/phase3b_manifest.json
    output_dir: results/phase3a-m4-direct-cypher
    models:
      - name: gemma4-26b-32k
        model: ollama/gemma4:26b
        options:
          num_ctx: 32768

      - name: qwen3-14b-64k
        model: ollama/qwen3:14b
        options:
          num_ctx: 65536

  phase3b_mcp_m4:
    kind: baseline-mcp
    manifest: datasets/phase3b_manifest.json
    output_dir: results/phase3b-m4-mcp
    mcp:
      max_steps: 20
      resource_mode: "off"
    models:
      - name: gemma4-26b-32k
        model: ollama/gemma4:26b
        options:
          num_ctx: 32768

      - name: qwen3-14b-64k
        model: ollama/qwen3:14b
        options:
          num_ctx: 65536
        max_steps: 24

  phase3c_mcp_resources_m4:
    kind: baseline-mcp
    manifest: datasets/phase3b_manifest.json
    output_dir: results/phase3c-m4-mcp-resources
    mcp:
      max_steps: 20
      resource_mode: on-demand
    models:
      - name: gemma4-26b-32k
        model: ollama/gemma4:26b
        options:
          num_ctx: 32768

      - name: qwen3-14b-64k
        model: ollama/qwen3:14b
        options:
          num_ctx: 65536
        max_steps: 24

  preflight_local:
    kind: preflight
    manifest: datasets/phase3b_manifest.json
    output_dir: results/preflight-from-config
