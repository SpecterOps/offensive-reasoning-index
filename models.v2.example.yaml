version: 2
protocol: ori-eval-protocol-v2

source:
  manifest: results/v2/simple-seed-1234/source/simple-v1-seed-1234_manifest.json
  archive: results/v2/simple-seed-1234/source/simple-v1-seed-1234.zip

tracks:
  direct:
    public: results/v2/simple-seed-1234/offline/simple-direct-seed-1234-public-v2.json
    oracles: results/v2/simple-seed-1234/offline/simple-direct-seed-1234-oracles-v2.private.json
    candidates: results/v2/simple-seed-1234/live/simple-seed-1234-direct-candidates-v2.json
    live_certification: results/v2/simple-seed-1234/live/simple-seed-1234-direct-live-certification.private.json
  mcp:
    public: results/v2/simple-seed-1234/offline/simple-mcp-seed-1234-public-v2.json
    oracles: results/v2/simple-seed-1234/offline/simple-mcp-seed-1234-oracles-v2.private.json
    candidates: results/v2/simple-seed-1234/live/simple-seed-1234-mcp-candidates-v2.json
    live_certification: results/v2/simple-seed-1234/live/simple-seed-1234-mcp-live-certification.private.json

modes: [direct, mcp]
output_dir: results/benchmark-runs/simple-v2-seed-1234-gpt56sol-vs-gpt55

defaults:
  concurrency: 1
  runs_per_model: 1
  # null uses BLOODHOUND_* values from the environment/.env file.
  bhce_url: null
  # null uses the selected provider's normal endpoint or OAuth adapter.
  model_base_url: null
  # One explicit effort applies to every Codex model and both tracks. Readiness
  # fails if any selected model does not advertise this level locally.
  reasoning_effort: high
  max_infra_retries: 1
  graph_page_size: 500
  health:
    timeout_seconds: 60.0
    poll_interval: 5.0
  mcp:
    mcp_dir: ../Bloodhound-MCP
    max_steps: 16
    resource_mode: "off"
    tool_loop: native-openai-compatible
    telemetry_adapter: auto
    # Provider and tool sub-deadlines must remain below every task deadline so
    # stalls are classified as infrastructure instead of model task timeouts.
    read_timeout_seconds: 240.0
    tool_timeout_seconds: 60.0

models:
  - name: gpt-5-6-sol
    provider: codex
    model: gpt-5.6-sol
    # auto preserves the established Codex OAuth Responses path.
    api_surface: auto
    mcp_tool_loop: native-openai-compatible
    options: {}

  - name: gpt-5-5
    provider: codex
    model: gpt-5.5
    api_surface: auto
    mcp_tool_loop: native-openai-compatible
    options: {}

  # OpenRouter and Nous Portal V2 entries use provider: openai-compat with
  # api_surface: auto (or explicit chat_completions). Copy one of these shapes
  # into a local config; do not add real keys to YAML.
  #
  # - name: openrouter-model
  #   provider: openai-compat
  #   model: <openrouter-model-id>
  #   api_surface: auto
  #   model_base_url: https://openrouter.ai/api/v1
  #   mcp_tool_loop: native-openai-compatible
  #   options: {}
  #
  # - name: nous-portal-model
  #   provider: openai-compat
  #   model: <nous-model-id>
  #   api_surface: auto
  #   model_base_url: https://inference-api.nousresearch.com/v1
  #   mcp_tool_loop: native-openai-compatible
  #   options: {}
