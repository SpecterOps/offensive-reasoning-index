# ORI — M4 Mac mini local model configuration
#
# Pass this file to:
#   ori baseline --models-file models-m4.yaml ...
#   ori baseline-mcp --models-file models-m4.yaml ...
#
# IMPORTANT:
#   This file assumes ORI is talking to the local Ollama on this Mac mini.
#   The repo's current `.env` still points `OLLAMA_BASE_URL` at the older remote host.
#   Override it in your shell before running:
#
#     export OLLAMA_BASE_URL=http://127.0.0.1:11434
#
# Model selection policy:
# - Use the base Ollama model names and let ORI separate runs by config-aware run identity
# - Keep models in alphabetical order
# - Use the same 32k and 64k contexts for every model so comparisons are apples-to-apples
# - 64k runs on the larger models may be slower/heavier on the 24 GB M4 host

defaults:
  concurrency: 1

models:
  - name: gemma4-26b-32k
    model: ollama/gemma4:26b
    options:
      num_ctx: 32768

  - name: gemma4-26b-64k
    model: ollama/gemma4:26b
    options:
      num_ctx: 65536

  - name: gemma4-e4b-32k
    model: ollama/gemma4:e4b
    options:
      num_ctx: 32768

  - name: gemma4-e4b-64k
    model: ollama/gemma4:e4b
    options:
      num_ctx: 65536

  - name: gpt-oss-20b-32k
    model: ollama/gpt-oss:20b
    options:
      num_ctx: 32768

  - name: gpt-oss-20b-64k
    model: ollama/gpt-oss:20b
    options:
      num_ctx: 65536

  - name: qwen3-14b-32k
    model: ollama/qwen3:14b
    options:
      num_ctx: 32768

  - name: qwen3-14b-64k
    model: ollama/qwen3:14b
    options:
      num_ctx: 65536

  - name: qwen3-coder-30b-32k
    model: ollama/qwen3-coder:30b
    options:
      num_ctx: 32768

  - name: qwen3-coder-30b-64k
    model: ollama/qwen3-coder:30b
    options:
      num_ctx: 65536

  - name: qwen3.5-27b-32k
    model: ollama/qwen3.5:27b
    options:
      num_ctx: 32768

  - name: qwen3.5-27b-64k
    model: ollama/qwen3.5:27b
    options:
      num_ctx: 65536

  - name: qwen3.5-9b-32k
    model: ollama/qwen3.5:9b
    options:
      num_ctx: 32768

  - name: qwen3.5-9b-64k
    model: ollama/qwen3.5:9b
    options:
      num_ctx: 65536
