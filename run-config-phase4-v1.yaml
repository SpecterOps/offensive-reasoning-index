version: 1

profiles:
  phase4_v1:
    kind: generate
    domain: CORP.LOCAL
    seed: 4401
    generator:
      profile: phase4_v1
    sizing:
      users: 32
      workstations: 12
      servers: 6
    output_zip: datasets/phase4-v1.zip
    output_manifest: datasets/phase4-v1_manifest.json

  phase4_v1_direct_best_stage3:
    kind: eval
    enabled: false
    manifest: datasets/phase4-v1_manifest.json
    output: results/phase4-v1/direct-best-stage3.csv
    model:
      name: ori-qwen35-9b-64k-direct
      model: ollama/ori-qwen35-9b-64k
      options:
        temperature: 0
    concurrency: 1
    max_model_reruns_on_infra: 1

  phase4_v1_full_mcp_best_stage3:
    kind: eval-mcp
    enabled: false
    manifest: datasets/phase4-v1_manifest.json
    output: results/phase4-v1/full-mcp-best-stage3.csv
    model:
      name: ori-qwen35-9b-64k-full-mcp
      model: ollama/ori-qwen35-9b-64k
      options:
        temperature: 0
    concurrency: 1
    max_model_reruns_on_infra: 1
    mcp:
      mcp_dir: ../bloodhound-mcp
      max_steps: 16
      resource_mode: on-demand
      tool_loop: auto
      openai_compat_telemetry_adapter: auto
      ollama_read_timeout_seconds: 1800
