# ORI — Baseline Model Configuration
#
# Pass this file to: ori baseline --models-file models.yaml ...
#
# Model string format:
#   ollama/MODEL              — local Ollama (uses OLLAMA_BASE_URL, default localhost:11434)
#   anthropic/MODEL           — Anthropic API (requires ANTHROPIC_API_KEY)
#   openai/MODEL              — OpenAI API (requires OPENAI_API_KEY)
#   gemini/MODEL              — Google Gemini (requires GEMINI_API_KEY)
#   openai-compat/MODEL@URL   — any OpenAI-compatible endpoint
#                                (OPENROUTER_API_KEY works for OpenRouter)
#   mock/perfect              — smoke test (no API key needed)

defaults:
  concurrency: 1   # keep at 1 for local Ollama; increase for cloud APIs

models:
  # ── Local Ollama (10.20.10.230) — 3080 10GB / 64GB RAM ───────────────────
  # Using 16k context for Phase 3B MCP runs.
  - model: ollama/hermes3:latest # 4.7 GB
    options:
      num_ctx: 16384
  - model: ollama/llama3.2:latest # 2.0 GB
    options:
      num_ctx: 16384
  - model: ollama/qwen3:latest # 5.2 GB
    options:
      num_ctx: 16384
  # - model: ollama/deepseek-r1:latest # 5.2 GB
  #   Disabled for MCP baselines: Ollama returns 'does not support tools', so Phase 3B/3C tool-use evals become all MODEL_ERROR.
  #   Keep as a direct-Cypher-only candidate unless tool support changes.
  #   options:
  #     num_ctx: 16384
  - model: ollama/qwen3.5:9b # 6.6 GB — thinking on by default
    options:
      num_ctx: 16384
  - model: ollama/qwen3:8b # 5.2 GB
    options:
      num_ctx: 16384
  - model: ollama/qwen3:14b # 9.3 GB
    options:
      num_ctx: 16384
  - model: ollama/qwen2.5-coder:14b # 9.0 GB — code-specialized
    options:
      num_ctx: 16384
  - model: ollama/gemma4:e4b # 9.6GB
    options:
      num_ctx: 16384
  # ── Recommended new Qwen models ───────────────────────────────────────────
  # Pull first: ollama pull qwen3.5:9b && ollama pull qwen3:14b && ollama pull qwen2.5-coder:14b
  # - model: ollama/qwen3.5:9b            # 6.6 GB — best new model, Feb 2026, hybrid thinking

  # - model: ollama/qwen3:14b             # 9.3 GB — highest quality that fits; num_ctx limits KV cache
  #   num_ctx: 4096

  # - model: ollama/qwen2.5-coder:14b     # 9.0 GB — code-specialized
  #   num_ctx: 4096

  # ── Too large for 10GB VRAM — comment back in if running CPU offload ──────
  # - model: ollama/qwen3-coder:30b-a3b-q4_K_M  # 18 GB
  # - model: ollama/gpt-oss:20b                  # 13 GB
  # - model: ollama/command-r-plus:latest        # 59 GB

  # ── Cloud APIs ─────────────────────────────────────────────────────────────
  # - model: anthropic/claude-sonnet-4-5
  #   concurrency: 3

  # - model: openai/gpt-4o
  #   concurrency: 3

  # ── Smoke tests ────────────────────────────────────────────────────────────
  # - model: mock/perfect
