# Model matrix for `ori run --config models.yaml --manifest <manifest.json>`.
# The same list is run in direct and MCP modes by default.

modes: [direct, mcp]
output_dir: results/benchmark-runs/example

defaults:
  concurrency: 1
  # Independent full passes per model against the same manifest.
  runs_per_model: 1
  bhce_url: null
  model_base_url: null
  max_model_reruns_on_infra: 1
  health:
    timeout_seconds: 60
    poll_interval: 5
  # Model-blind guard for direct Cypher only. Rejected queries receive
  # QUERY_TOO_EXPENSIVE without being sent to BloodHound.
  direct_query_safety:
    enabled: true
    policy_version: bloodhound-cysql-direct-v2
    server_timeout_seconds: 10
    client_timeout_seconds: 15
    max_recursive_hops: 12
    max_result_rows: 1000
    max_query_characters: 16384
    max_recursive_patterns: 2
  mcp:
    mcp_dir: ../bloodhound-mcp
    max_steps: 16
    resource_mode: "off"
    tool_loop: auto
    openai_compat_telemetry_adapter: auto
    ollama_read_timeout_seconds: 900
  telemetry:
    enabled: true

models:
  - name: local-qwen-fast
    provider: openai-compat
    model: qwen-fast
    model_base_url: http://death-star:8080/v1
    mcp_tool_loop: native-openai-compatible
    openai_compat_telemetry_adapter: llama-cpp
    mcp_ollama_read_timeout_seconds: 1800
    options:
      temperature: 0

  - name: codex-gpt-5-5
    provider: codex
    model: gpt-5.5
    # Per-model override of defaults.runs_per_model.
    runs_per_model: 3
    mcp_tool_loop: native-openai-compatible
    options:
      temperature: 0

  - name: anthropic-sonnet
    provider: anthropic
    model: claude-sonnet-4-5
    options:
      temperature: 0

  - name: ollama-qwen
    provider: ollama
    model: qwen3:14b
    mcp_tool_loop: native-ollama
    options:
      num_ctx: 65536
      temperature: 0
