# Protocol V1 model-matrix template.
# Copy this file to an ignored local config and edit the manifest, provider,
# model ID, endpoint, and output_dir for your campaign.
# Paths are resolved from the config file's directory.

version: 1
manifest: datasets/benchmarks/complex-v1-seed-4401_manifest.json
modes: [direct, mcp]
output_dir: results/benchmark-runs/change-me

defaults:
  concurrency: 1
  runs_per_model: 1
  max_model_reruns_on_infra: 1
  direct_query_safety:
    enabled: true
    policy_version: bloodhound-cysql-direct-v3
    server_timeout_seconds: 10
    client_timeout_seconds: 15
    max_recursive_hops: 12
    max_result_rows: 1000
    max_query_characters: 16384
    max_recursive_patterns: 2
    max_recursive_expansion_complexity: 256
  mcp:
    launcher: uvx_git
    source: git+https://github.com/mwnickerson/bloodhound_mcp@cdb17097e761c8a8622cb93bc3ba49a9e150bb6e
    executable: bloodhound-mcp
    max_steps: 16
    resource_mode: "off"
    tool_loop: auto
  telemetry:
    enabled: true

models:
  - name: example-model
    provider: openai-compat
    model: <provider-model-id>
    model_base_url: https://provider.example/v1
    mcp_tool_loop: native-openai-compatible
    openai_compat_telemetry_adapter: generic
    options:
      temperature: 0

# For Codex OAuth, replace the model entry above with:
#   - name: codex-model
#     provider: codex
#     model: <available-codex-model-slug>
#     mcp_tool_loop: native-openai-compatible
