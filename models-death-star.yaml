# ORI model definitions for Matthew's death-star OpenAI-compatible llama-swap endpoint.
#
# Use these with config-driven profiles or the baseline/baseline-mcp commands:
#   ori baseline-mcp --manifest <manifest.json> --models-file models-death-star.yaml --output-dir <out>
#
# Operational rule: before any real benchmark where death-star is the model under
# test, reserve the host so Hermes cron/agent traffic does not contend with the
# eval:
#   deathstar-reserve --owner dogwalker --reason 'ORI run using death-star inference' --model qwen-fast --artifact-root <run-root>
#   ...run ORI...
#   deathstar-release

defaults:
  concurrency: 1

models:
  - name: death-star-qwen-fast-64k
    model: openai-compat/qwen-fast
    model_base_url: http://death-star:8080/v1
    mcp_tool_loop: native-openai-compatible
    openai_compat_telemetry_adapter: llama-cpp
    mcp_ollama_read_timeout_seconds: 1800
    concurrency: 1
    options:
      temperature: 0

  - name: death-star-qwen-large-262k
    model: openai-compat/qwen3.6-27b
    model_base_url: http://death-star:8080/v1
    mcp_tool_loop: native-openai-compatible
    openai_compat_telemetry_adapter: llama-cpp
    mcp_ollama_read_timeout_seconds: 2400
    concurrency: 1
    options:
      temperature: 0
