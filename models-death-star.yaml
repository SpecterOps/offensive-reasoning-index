# Portable OpenAI-compatible model examples (legacy filename retained).
#
# Use these with config-driven profiles or the baseline/baseline-mcp commands:
#   ori baseline-mcp --manifest <manifest.json> --models-file models-death-star.yaml --output-dir <out>
#
# Legacy model names are stable identifiers, not required hostnames. Set
# model_base_url and model to the endpoint and model ID of your own server.
# The loopback default works with a locally hosted OpenAI-compatible server.
# Configure authentication through OPENAI_COMPAT_API_KEY when needed; never
# put credentials in this file. Inference service management is external to ORI.

defaults:
  concurrency: 1

models:
  - name: death-star-qwen-fast-64k
    model: openai-compat/qwen-fast
    model_base_url: http://127.0.0.1:8080/v1
    mcp_tool_loop: native-openai-compatible
    openai_compat_telemetry_adapter: llama-cpp
    mcp_ollama_read_timeout_seconds: 1800
    concurrency: 1
    options:
      temperature: 0

  - name: death-star-qwen-large-262k
    model: openai-compat/qwen3.6-27b
    model_base_url: http://127.0.0.1:8080/v1
    mcp_tool_loop: native-openai-compatible
    openai_compat_telemetry_adapter: llama-cpp
    mcp_ollama_read_timeout_seconds: 2400
    concurrency: 1
    options:
      temperature: 0
