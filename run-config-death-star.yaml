version: 1

# Portable OpenAI-compatible example; legacy filename and profile IDs retained.
# Profile IDs do not select a machine. Set model_base_url and model IDs for
# your own local or remote inference server. Authentication, when needed, uses
# OPENAI_COMPAT_API_KEY; BloodHound uses the documented BLOODHOUND_* environment
# fields. No personal-agent installation or host reservation is required by ORI.
#
# Generate the matching dataset and configure your MCP checkout before running:
#   ori generate complex --seed 4401 --output datasets/benchmarks
#   ori run --config run-config-death-star.yaml --profile death_star_qwen_fast_mcp
# Paths below resolve relative to this config file, including after relocation.

defaults:
  bhce_url: null
  concurrency: 1
  model_base_url: http://127.0.0.1:8080/v1
  max_model_reruns_on_infra: 1
  health:
    timeout_seconds: 60
    poll_interval: 5
  mcp:
    mcp_dir: ../bloodhound-mcp
    max_steps: 16
    resource_mode: on-demand
    tool_loop: native-openai-compatible
    openai_compat_telemetry_adapter: llama-cpp
    ollama_read_timeout_seconds: 1800
  telemetry:
    enabled: true

profiles:
  death_star_qwen_fast_direct:
    enabled: false
    kind: baseline
    manifest: datasets/benchmarks/complex-v1-seed-4401_manifest.json
    output_dir: results/death-star/phase4b-v2-medium/qwen-fast-direct
    models:
      - name: death-star-qwen-fast-64k
        model: openai-compat/qwen-fast
        concurrency: 1
        options:
          temperature: 0

  death_star_qwen_fast_mcp:
    enabled: false
    kind: baseline-mcp
    manifest: datasets/benchmarks/complex-v1-seed-4401_manifest.json
    output_dir: results/death-star/phase4b-v2-medium/qwen-fast-mcp
    mcp:
      max_steps: 20
      resource_mode: on-demand
      tool_loop: native-openai-compatible
      openai_compat_telemetry_adapter: llama-cpp
      ollama_read_timeout_seconds: 1800
    models:
      - name: death-star-qwen-fast-64k-mcp
        model: openai-compat/qwen-fast
        concurrency: 1
        options:
          temperature: 0

  death_star_qwen_large_mcp:
    enabled: false
    kind: baseline-mcp
    manifest: datasets/benchmarks/complex-v1-seed-4401_manifest.json
    output_dir: results/death-star/phase4b-v2-medium/qwen-large-mcp
    mcp:
      max_steps: 20
      resource_mode: on-demand
      tool_loop: native-openai-compatible
      openai_compat_telemetry_adapter: llama-cpp
      ollama_read_timeout_seconds: 2400
    models:
      - name: death-star-qwen-large-262k-mcp
        model: openai-compat/qwen3.6-27b
        concurrency: 1
        options:
          temperature: 0
